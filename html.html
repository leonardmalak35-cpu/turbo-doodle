<!DOCTYPE html>q
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101522;
      color: #f3f6ff;
      font-family: system-ui, sans-serif;
    }

    .game {
      width: min(900px, 94vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: 0.18em;
    }

    canvas {
      display: block;
      width: 100%;
      background: #080c14;
      border: 2px solid #48536b;
      border-radius: 8px;
      cursor: none;
    }

    p {
      color: #aeb8cc;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>PONG</h1>
    <canvas id="board" width="900" height="520" aria-label="Pong game"></canvas>
    <p>Move your mouse or use ↑ / ↓ to control the left paddle.</p>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const paddle = { width: 14, height: 100, speed: 7 };
    const player = { x: 28, y: (H - paddle.height) / 2, score: 0 };
    const computer = { x: W - 28 - paddle.width, y: (H - paddle.height) / 2, score: 0 };
    const ball = { x: W / 2, y: H / 2, radius: 9, vx: 5, vy: 3 };

    const keys = new Set();
    let mouseControls = true;

    function resetBall(direction) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = 5 * direction;
      ball.vy = (Math.random() * 4 - 2) || 1;
    }

    function movePlayerTo(y) {
      player.y = Math.max(0, Math.min(H - paddle.height, y));
    }

    canvas.addEventListener("mousemove", (event) => {
      if (!mouseControls) return;
      const rect = canvas.getBoundingClientRect();
      const scaleY = H / rect.height;
      movePlayerTo((event.clientY - rect.top) * scaleY - paddle.height / 2);
    });

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
        mouseControls = false;
        keys.add(event.key);
      }
    });

    window.addEventListener("keyup", (event) => keys.delete(event.key));
    canvas.addEventListener("mouseenter", () => { mouseControls = true; });

    function update() {
      if (keys.has("ArrowUp")) movePlayerTo(player.y - paddle.speed);
      if (keys.has("ArrowDown")) movePlayerTo(player.y + paddle.speed);

      // Computer paddle follows the ball, with limited movement speed.
      const computerCenter = computer.y + paddle.height / 2;
      const target = ball.y;
      const difference = target - computerCenter;
      computer.y += Math.max(-5, Math.min(5, difference));
      computer.y = Math.max(0, Math.min(H - paddle.height, computer.y));

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top and bottom wall collisions.
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= H) {
        ball.vy *= -1;
        ball.y = Math.max(ball.radius, Math.min(H - ball.radius, ball.y));
      }

      // Paddle collisions; hit position changes the ball's angle.
      for (const bat of [player, computer]) {
        const overlapsY =
          ball.y + ball.radius >= bat.y &&
          ball.y - ball.radius <= bat.y + paddle.height;
        const overlapsX =
          ball.x + ball.radius >= bat.x &&
          ball.x - ball.radius <= bat.x + paddle.width;

        if (overlapsX && overlapsY) {
          const direction = bat === player ? 1 : -1;
          const hitOffset =
            (ball.y - (bat.y + paddle.height / 2)) / (paddle.height / 2);

          ball.vx = direction * Math.min(Math.abs(ball.vx) + 0.35, 9);
          ball.vy = hitOffset * 5;
          ball.x = direction === 1
            ? bat.x + paddle.width + ball.radius
            : bat.x - ball.radius;
        }
      }

      // Score when the ball passes a paddle.
      if (ball.x + ball.radius < 0) {
        computer.score++;
        resetBall(1);
      } else if (ball.x - ball.radius > W) {
        player.score++;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Dashed center line and scoreboard.
      ctx.strokeStyle = "#354057";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#f3f6ff";
      ctx.font = "bold 42px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(player.score, W / 2 - 70, 58);
      ctx.fillText(computer.score, W / 2 + 70, 58);

      // Paddles and ball.
      ctx.fillStyle = "#f3f6ff";
      ctx.fillRect(player.x, player.y, paddle.width, paddle.height);
      ctx.fillRect(computer.x, computer.y, paddle.width, paddle.height);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
